<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Engagement Invitation — Sucharitha &amp; Rahul</title>
<style>
  :root{
    --maroon:#6f1d2b;
    --maroon-deep:#4a1220;
    --gold:#c8992f;
    --gold-light:#f3d998;
    --ivory:#fbf3df;
    --ink:#4a2a12;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:'Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;background:var(--ivory);color:var(--ink)}
  body{
    display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(200,153,47,.16), transparent 55%),
      radial-gradient(ellipse at 82% 85%, rgba(111,29,43,.14), transparent 55%),
      linear-gradient(160deg,#fdf6e6 0%,#f7ecd0 45%,#f3e3bd 100%);
  }
  body:before{
    content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
    background-image:radial-gradient(rgba(111,29,43,.035) 1px, transparent 1px);
    background-size:3px 3px;
  }

  .scene{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;perspective:1800px;padding:18px;position:relative;z-index:2}

  .corner-motif{position:fixed;width:120px;height:120px;opacity:.5;pointer-events:none;z-index:1;filter:drop-shadow(0 4px 6px rgba(111,29,43,.1))}
  .corner-motif svg{width:100%;height:100%}
  .cm-tl{top:-10px;left:-10px}
  .cm-br{bottom:-10px;right:-10px;transform:rotate(180deg)}

  .petals{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
  .petal{position:absolute;top:-5%;font-size:16px;opacity:0;user-select:none;will-change:transform,opacity}
  @keyframes fall{
    0%{opacity:0;transform:translate(0,0) rotate(0deg)}
    8%{opacity:.9}
    92%{opacity:.85}
    100%{opacity:0;transform:translate(var(--drift),115vh) rotate(360deg)}
  }

  /* ---- envelope: horizontal gate-fold ---- */
  .envelope-wrap{position:relative;width:min(92vw,430px);height:min(88vh,660px);max-height:660px;cursor:pointer;filter:drop-shadow(0 22px 34px rgba(74,18,32,.28))}
  .envelope{position:absolute;inset:0;border-radius:14px;transform-style:preserve-3d}

  .back{position:absolute;inset:0;border-radius:14px;background:linear-gradient(145deg,#eccf95,#faeecb 46%,#dcb877 100%);
    border:2px solid var(--gold);overflow:hidden;box-shadow:inset 0 0 40px rgba(111,29,43,.06)}
  .back:before{content:'';position:absolute;inset:12px;border:1px solid rgba(111,29,43,.35);border-radius:9px}
  .back:after{content:'';position:absolute;inset:18px;border:1px solid rgba(200,153,47,.5);border-radius:6px}

  .back-note{position:absolute;z-index:3;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--maroon);text-align:center;padding:40px;gap:10px}
  .back-note .glyph{font-size:34px;color:var(--gold);text-shadow:0 2px 3px rgba(255,255,255,.5)}
  .back-note .txt{font-size:16px;letter-spacing:4px;font-weight:600}
  .back-note .sub{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;opacity:.85}

  .card{position:absolute;inset:5px;z-index:4;background:var(--ivory);border-radius:11px;padding:9px;
    transform:scale(.92);opacity:0;transform-origin:center;
    transition:transform 1.05s .5s cubic-bezier(.2,.8,.2,1),opacity .9s .5s;overflow:auto;
    box-shadow:0 10px 30px rgba(74,18,32,.18)}
  .card img{display:block;width:100%;height:auto;border-radius:8px}

  .map-block{margin-top:10px;padding:12px 10px 14px;border-top:1px dashed rgba(200,153,47,.55);display:flex;justify-content:center}
  .directions-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:fit-content;
    text-decoration:none;background:var(--maroon);color:var(--gold-light);padding:11px 22px;border-radius:24px;
    font:600 12px/1 Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;box-shadow:0 5px 12px rgba(74,18,32,.25)}
  .directions-btn svg{width:15px;height:15px;flex-shrink:0}

  /* two doors that swing open horizontally, hinged at the outer edges */
  .door{position:absolute;top:0;bottom:0;width:50%;z-index:6;
    background:linear-gradient(145deg,#f9edd0,#e2c48c);
    box-shadow:inset 0 0 18px rgba(111,29,43,.08);
    transition:transform 1.1s cubic-bezier(.2,.8,.2,1);
    border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);
    backface-visibility:hidden}
  .door-l{left:0;transform-origin:left center;border-top-left-radius:14px;border-bottom-left-radius:14px;border-left:2px solid var(--gold)}
  .door-r{right:0;transform-origin:right center;border-top-right-radius:14px;border-bottom-right-radius:14px;border-right:2px solid var(--gold)}
  .door:after{content:'';position:absolute;inset:10px;border:1px solid rgba(200,153,47,.45)}
  .door-l:after{border-right:none}
  .door-r:after{border-left:none}

  /* subtle center crease shadow */
  .seam-shadow{position:absolute;left:50%;top:0;bottom:0;width:26px;transform:translateX(-50%);
    background:linear-gradient(90deg,transparent,rgba(74,18,32,.14),transparent);z-index:7;pointer-events:none;
    transition:opacity .5s}

  .ribbon{position:absolute;z-index:8;left:0;right:0;top:50%;height:22px;transform:translateY(-50%);
    background:linear-gradient(180deg,var(--maroon-deep),var(--maroon) 45%,var(--maroon-deep));
    box-shadow:0 0 0 1px rgba(200,153,47,.4) inset;opacity:.92;transition:opacity .5s}

  .seal{position:absolute;z-index:9;left:50%;top:15%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #9c3348, var(--maroon) 60%, var(--maroon-deep) 100%);
    border:3px solid rgba(243,217,152,.8);display:flex;align-items:center;justify-content:center;
    color:var(--gold-light);font:italic 20px 'Iowan Old Style',Georgia,serif;
    box-shadow:0 6px 16px rgba(74,18,32,.35), inset 0 0 10px rgba(0,0,0,.25);transition:opacity .4s,transform .5s}

  @keyframes ring{0%{transform:scale(.94);opacity:.9}100%{transform:scale(1.22);opacity:0}}

  .open .door-l{transform:rotateY(-112deg)}
  .open .door-r{transform:rotateY(112deg)}
  .open .seal{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.4) rotate(25deg)}
  .open .ribbon{opacity:0}
  .open .seam-shadow{opacity:0}
  .open .card{transform:scale(1);opacity:1;z-index:5}

  @media(max-height:650px){.envelope-wrap{height:92vh}}
  @media(prefers-reduced-motion:reduce){
    .petal{animation:none!important}
    .door,.card,.seal,.ribbon,.seam-shadow{transition-duration:.4s!important}
  }
</style>
</head>
